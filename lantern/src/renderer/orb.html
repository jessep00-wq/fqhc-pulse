<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:" />
    <title>Lantern</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
        /* The window is mostly empty; only the orb should feel clickable. */
        cursor: default;
        user-select: none;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }
      #orb {
        width: 100%;
        height: 100%;
        display: block;
        transition: transform 220ms ease;
      }
      body.hot #orb { transform: scale(1.04); cursor: pointer; }
      #caption {
        position: absolute;
        left: 50%;
        bottom: 6px;
        transform: translateX(-50%);
        max-width: 240px;
        padding: 6px 10px;
        border-radius: 10px;
        background: rgba(20, 8, 20, 0.72);
        backdrop-filter: blur(8px);
        color: #f6ece2;
        font-size: 11px;
        line-height: 1.35;
        text-align: center;
        opacity: 0;
        transition: opacity 200ms ease;
        pointer-events: none;
      }
      #caption.visible { opacity: 1; }
      @media (prefers-reduced-motion: reduce) {
        #orb { transition: none; }
      }
    </style>
  </head>
  <body data-state="idle">
    <div id="stage">
      <canvas id="orb"></canvas>
      <div id="caption"></div>
    </div>
    <script type="module" src="./orb/main.ts"></script>
  </body>
</html>
